<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Profile Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .element {
            width: 120px;
            height: 160px;
            background: rgba(0, 127, 127, 0.75);
            border: 1px solid rgba(127, 255, 255, 0.25);
            border-radius: 4px;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .element:hover {
            background: rgba(0, 127, 127, 0.9);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        }

        .element .number {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .element .photo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 5px auto;
            display: block;
            object-fit: cover;
        }

        .element .name {
            font-size: 14px;
            font-weight: bold;
            margin: 5px 0;
        }

        .element .details {
            font-size: 10px;
            line-height: 1.2;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .controls button {
            background: rgba(0, 127, 127, 0.8);
            border: 1px solid rgba(127, 255, 255, 0.5);
            color: white;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .controls button:hover {
            background: rgba(0, 127, 127, 1);
        }

        .controls button.active {
            background: rgba(0, 200, 200, 1);
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2000;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading 3D Profile Visualization...</p>
    </div>

    <div id="container"></div>

    <div class="controls">
        <button id="table" class="active">TABLE</button>
        <button id="sphere">SPHERE</button>
        <button id="helix">HELIX</button>
        <button id="grid">GRID</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r110/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="app.js"></script>
</body>
</html>
