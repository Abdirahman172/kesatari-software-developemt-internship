<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Profile Visualization - Periodic Table Style</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Three.js and required components - using working versions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <!-- CSS3DRenderer and TrackballControls - inline working versions -->
    <script>
        // Wait for THREE to be loaded
        window.addEventListener('load', function() {
            if (typeof THREE !== 'undefined') {
                console.log('✅ THREE.js loaded, version:', THREE.REVISION);
                
                // CSS3DObject
                THREE.CSS3DObject = function ( element ) {
                    THREE.Object3D.call( this );
                    this.element = element;
                    this.element.style.position = 'absolute';
                    this.element.style.pointerEvents = 'auto';
                    this.addEventListener( 'removed', function () {
                        this.traverse( function ( child ) {
                            if ( child.element instanceof Element && child.element.parentNode ) {
                                child.element.parentNode.removeChild( child.element );
                            }
                        } );
                    } );
                };
                THREE.CSS3DObject.prototype = Object.create( THREE.Object3D.prototype );
                THREE.CSS3DObject.prototype.constructor = THREE.CSS3DObject;
                THREE.CSS3DObject.prototype.copy = function ( source, recursive ) {
                    THREE.Object3D.prototype.copy.call( this, source, recursive );
                    this.element = source.element.cloneNode( true );
                    return this;
                };

                // CSS3DSprite
                THREE.CSS3DSprite = function ( element ) {
                    THREE.CSS3DObject.call( this, element );
                    this.rotation2D = 0;
                };
                THREE.CSS3DSprite.prototype = Object.create( THREE.CSS3DObject.prototype );
                THREE.CSS3DSprite.prototype.constructor = THREE.CSS3DSprite;
                THREE.CSS3DSprite.prototype.copy = function ( source, recursive ) {
                    THREE.CSS3DObject.prototype.copy.call( this, source, recursive );
                    this.rotation2D = source.rotation2D;
                    return this;
                };

                // CSS3DRenderer
                THREE.CSS3DRenderer = function ( parameters ) {
                    console.log( 'THREE.CSS3DRenderer', THREE.REVISION );
                    parameters = parameters || {};
                    var _this = this;
                    var _width, _height;
                    var _widthHalf, _heightHalf;
                    var matrix = new THREE.Matrix4();
                    var cache = {
                        camera: { fov: 0, style: '' },
                        objects: new WeakMap()
                    };
                    var domElement = document.createElement( 'div' );
                    domElement.style.overflow = 'hidden';
                    this.domElement = domElement;
                    var cameraElement = document.createElement( 'div' );
                    cameraElement.style.WebkitTransformStyle = 'preserve-3d';
                    cameraElement.style.transformStyle = 'preserve-3d';
                    domElement.appendChild( cameraElement );

                    this.setSize = function ( width, height ) {
                        _width = width;
                        _height = height;
                        _widthHalf = _width / 2;
                        _heightHalf = _height / 2;
                        domElement.style.width = width + 'px';
                        domElement.style.height = height + 'px';
                        cameraElement.style.width = width + 'px';
                        cameraElement.style.height = height + 'px';
                    };

                    var epsilon = function ( value ) {
                        return Math.abs( value ) < 1e-10 ? 0 : value;
                    };

                    var getCameraCSSMatrix = function ( matrix ) {
                        var elements = matrix.elements;
                        return 'matrix3d(' +
                            epsilon( elements[ 0 ] ) + ',' +
                            epsilon( - elements[ 1 ] ) + ',' +
                            epsilon( elements[ 2 ] ) + ',' +
                            epsilon( elements[ 3 ] ) + ',' +
                            epsilon( elements[ 4 ] ) + ',' +
                            epsilon( - elements[ 5 ] ) + ',' +
                            epsilon( elements[ 6 ] ) + ',' +
                            epsilon( elements[ 7 ] ) + ',' +
                            epsilon( elements[ 8 ] ) + ',' +
                            epsilon( - elements[ 9 ] ) + ',' +
                            epsilon( elements[ 10 ] ) + ',' +
                            epsilon( elements[ 11 ] ) + ',' +
                            epsilon( elements[ 12 ] ) + ',' +
                            epsilon( - elements[ 13 ] ) + ',' +
                            epsilon( elements[ 14 ] ) + ',' +
                            epsilon( elements[ 15 ] ) +
                        ')';
                    };

                    var getObjectCSSMatrix = function ( matrix, cameraCSSMatrix ) {
                        var elements = matrix.elements;
                        var matrix3d = 'matrix3d(' +
                            epsilon( elements[ 0 ] ) + ',' +
                            epsilon( elements[ 1 ] ) + ',' +
                            epsilon( elements[ 2 ] ) + ',' +
                            epsilon( elements[ 3 ] ) + ',' +
                            epsilon( - elements[ 4 ] ) + ',' +
                            epsilon( - elements[ 5 ] ) + ',' +
                            epsilon( - elements[ 6 ] ) + ',' +
                            epsilon( - elements[ 7 ] ) + ',' +
                            epsilon( elements[ 8 ] ) + ',' +
                            epsilon( elements[ 9 ] ) + ',' +
                            epsilon( elements[ 10 ] ) + ',' +
                            epsilon( elements[ 11 ] ) + ',' +
                            epsilon( elements[ 12 ] ) + ',' +
                            epsilon( elements[ 13 ] ) + ',' +
                            epsilon( elements[ 14 ] ) + ',' +
                            epsilon( elements[ 15 ] ) +
                        ')';
                        if ( cameraCSSMatrix === 'none' ) {
                            return 'translate3d(-50%,-50%,0) ' + matrix3d;
                        } else {
                            return 'translate3d(-50%,-50%,0) ' + matrix3d + ' ' + cameraCSSMatrix;
                        }
                    };

                    var renderObject = function ( object, scene, camera, cameraCSSMatrix ) {
                        if ( object instanceof THREE.CSS3DObject ) {
                            var style;
                            if ( object instanceof THREE.CSS3DSprite ) {
                                matrix.copy( camera.matrixWorldInverse );
                                matrix.transpose();
                                matrix.copyPosition( object.matrixWorld );
                                matrix.scale( object.scale );
                                matrix.elements[ 3 ] = 0;
                                matrix.elements[ 7 ] = 0;
                                matrix.elements[ 11 ] = 0;
                                matrix.elements[ 15 ] = 1;
                                style = getObjectCSSMatrix( matrix, cameraCSSMatrix );
                            } else {
                                style = getObjectCSSMatrix( object.matrixWorld, cameraCSSMatrix );
                            }
                            var element = object.element;
                            var cachedObject = cache.objects.get( object );
                            if ( cachedObject === undefined || cachedObject.style !== style ) {
                                element.style.WebkitTransform = style;
                                element.style.transform = style;
                                var objectData = { style: style };
                                cache.objects.set( object, objectData );
                            }
                            if ( element.parentNode !== cameraElement ) {
                                cameraElement.appendChild( element );
                            }
                        }
                        for ( var i = 0, l = object.children.length; i < l; i ++ ) {
                            renderObject( object.children[ i ], scene, camera, cameraCSSMatrix );
                        }
                    };

                    this.render = function ( scene, camera ) {
                        var fov = camera.projectionMatrix.elements[ 5 ] * _heightHalf;
                        var style = "translate3d(0,0," + fov + "px)" + getCameraCSSMatrix( camera.matrixWorldInverse ) + " translate3d(" + _widthHalf + "px," + _heightHalf + "px, 0)";
                        if ( cache.camera.style !== style ) {
                            cameraElement.style.WebkitTransform = style;
                            cameraElement.style.transform = style;
                            cache.camera.style = style;
                        }
                        renderObject( scene, scene, camera, style );
                    };
                };

                // TrackballControls
                THREE.TrackballControls = function ( object, domElement ) {
                    var _this = this;
                    var STATE = { NONE: - 1, ROTATE: 0, ZOOM: 1, PAN: 2, TOUCH_ROTATE: 3, TOUCH_ZOOM_PAN: 4 };
                    this.object = object;
                    this.domElement = ( domElement !== undefined ) ? domElement : document;
                    this.enabled = true;
                    this.screen = { left: 0, top: 0, width: 0, height: 0 };
                    this.rotateSpeed = 1.0;
                    this.zoomSpeed = 1.2;
                    this.panSpeed = 0.3;
                    this.noRotate = false;
                    this.noZoom = false;
                    this.noPan = false;
                    this.staticMoving = false;
                    this.dynamicDampingFactor = 0.2;
                    this.minDistance = 0;
                    this.maxDistance = Infinity;
                    this.keys = [ 65 /*A*/, 83 /*S*/, 68 /*D*/ ];
                    this.target = new THREE.Vector3();
                    var EPS = 0.000001;
                    var lastPosition = new THREE.Vector3();
                    var _state = STATE.NONE,
                    _prevState = STATE.NONE,
                    _eye = new THREE.Vector3(),
                    _movePrev = new THREE.Vector2(),
                    _moveCurr = new THREE.Vector2(),
                    _lastAxis = new THREE.Vector3(),
                    _lastAngle = 0,
                    _zoomStart = new THREE.Vector2(),
                    _zoomEnd = new THREE.Vector2(),
                    _touchZoomDistanceStart = 0,
                    _touchZoomDistanceEnd = 0,
                    _panStart = new THREE.Vector2(),
                    _panEnd = new THREE.Vector2();
                    this.target0 = this.target.clone();
                    this.position0 = this.object.position.clone();
                    this.up0 = this.object.up.clone();

                    this.handleResize = function () {
                        if ( this.domElement === document ) {
                            this.screen.left = 0;
                            this.screen.top = 0;
                            this.screen.width = window.innerWidth;
                            this.screen.height = window.innerHeight;
                        } else {
                            var box = this.domElement.getBoundingClientRect();
                            var d = this.domElement.ownerDocument.documentElement;
                            this.screen.left = box.left + window.pageXOffset - d.clientLeft;
                            this.screen.top = box.top + window.pageYOffset - d.clientTop;
                            this.screen.width = box.width;
                            this.screen.height = box.height;
                        }
                    };

                    this.update = function () {
                        _eye.subVectors( _this.object.position, _this.target );
                        if ( ! _this.noRotate ) {
                            _this.rotateCamera();
                        }
                        if ( ! _this.noZoom ) {
                            _this.zoomCamera();
                        }
                        if ( ! _this.noPan ) {
                            _this.panCamera();
                        }
                        _this.object.position.addVectors( _this.target, _eye );
                        _this.checkDistances();
                        _this.object.lookAt( _this.target );
                        if ( lastPosition.distanceToSquared( _this.object.position ) > EPS ) {
                            _this.dispatchEvent( { type: 'change' } );
                            lastPosition.copy( _this.object.position );
                        }
                    };

                    this.rotateCamera = function () {
                        var angle = Math.sqrt( _moveCurr.x * _moveCurr.x + _moveCurr.y * _moveCurr.y );
                        if ( angle ) {
                            var axis = new THREE.Vector3(),
                                quaternion = new THREE.Quaternion();
                            axis.set( _moveCurr.y, _moveCurr.x, 0 ).normalize();
                            angle *= _this.rotateSpeed;
                            quaternion.setFromAxisAngle( axis, -angle );
                            _eye.applyQuaternion( quaternion );
                            _this.object.up.applyQuaternion( quaternion );
                            _lastAxis.copy( axis );
                            _lastAngle = angle;
                        } else if ( ! _this.staticMoving && _lastAngle ) {
                            _lastAngle *= Math.sqrt( 1.0 - _this.dynamicDampingFactor );
                            _eye.copy( _this.object.position ).sub( _this.target );
                            quaternion.setFromAxisAngle( _lastAxis, -_lastAngle );
                            _eye.applyQuaternion( quaternion );
                            _this.object.up.applyQuaternion( quaternion );
                        }
                        _movePrev.copy( _moveCurr );
                    };

                    this.zoomCamera = function () {
                        var factor;
                        if ( _state === STATE.TOUCH_ZOOM_PAN ) {
                            factor = _touchZoomDistanceStart / _touchZoomDistanceEnd;
                            _touchZoomDistanceStart = _touchZoomDistanceEnd;
                            _eye.multiplyScalar( factor );
                        } else {
                            factor = 1.0 + ( _zoomEnd.y - _zoomStart.y ) * _this.zoomSpeed;
                            if ( factor !== 1.0 && factor > 0.0 ) {
                                _eye.multiplyScalar( factor );
                            }
                            if ( _this.staticMoving ) {
                                _zoomStart.copy( _zoomEnd );
                            } else {
                                _zoomStart.y += ( _zoomEnd.y - _zoomStart.y ) * this.dynamicDampingFactor;
                            }
                        }
                    };

                    this.panCamera = function () {
                        var mouseChange = new THREE.Vector2(),
                            objectUp = new THREE.Vector3(),
                            pan = new THREE.Vector3();
                        mouseChange.copy( _panEnd ).sub( _panStart );
                        if ( mouseChange.lengthSq() ) {
                            mouseChange.multiplyScalar( _eye.length() * _this.panSpeed );
                            pan.copy( _eye ).cross( _this.object.up ).setLength( mouseChange.x );
                            pan.add( objectUp.copy( _this.object.up ).setLength( mouseChange.y ) );
                            _this.object.position.add( pan );
                            _this.target.add( pan );
                            if ( _this.staticMoving ) {
                                _panStart.copy( _panEnd );
                            } else {
                                _panStart.add( mouseChange.subVectors( _panEnd, _panStart ).multiplyScalar( _this.dynamicDampingFactor ) );
                            }
                        }
                    };

                    this.checkDistances = function () {
                        if ( ! _this.noZoom || ! _this.noPan ) {
                            if ( _eye.lengthSq() > _this.maxDistance * _this.maxDistance ) {
                                _this.object.position.addVectors( _this.target, _eye.setLength( _this.maxDistance ) );
                                _zoomStart.copy( _zoomEnd );
                            }
                            if ( _eye.lengthSq() < _this.minDistance * _this.minDistance ) {
                                _this.object.position.addVectors( _this.target, _eye.setLength( _this.minDistance ) );
                                _zoomStart.copy( _zoomEnd );
                            }
                        }
                    };

                    function getMouseOnScreen( pageX, pageY ) {
                        var vector = new THREE.Vector2();
                        vector.set(
                            ( pageX - _this.screen.left ) / _this.screen.width,
                            ( pageY - _this.screen.top ) / _this.screen.height
                        );
                        return vector;
                    }

                    function getMouseOnCircle( pageX, pageY ) {
                        var vector = new THREE.Vector2();
                        vector.set(
                            ( ( pageX - _this.screen.width * 0.5 - _this.screen.left ) / ( _this.screen.width * 0.5 ) ),
                            ( ( _this.screen.height + 2 * ( _this.screen.top - pageY ) ) / _this.screen.width )
                        );
                        return vector;
                    }

                    this.addEventListener = THREE.EventDispatcher.prototype.addEventListener;
                    this.hasEventListener = THREE.EventDispatcher.prototype.hasEventListener;
                    this.removeEventListener = THREE.EventDispatcher.prototype.removeEventListener;
                    this.dispatchEvent = THREE.EventDispatcher.prototype.dispatchEvent;

                    this.domElement.addEventListener( 'contextmenu', function ( event ) { event.preventDefault(); }, false );
                    this.domElement.addEventListener( 'mousedown', function ( event ) {
                        if ( _this.enabled === false ) return;
                        event.preventDefault();
                        event.stopPropagation();
                        if ( _state === STATE.NONE ) {
                            _state = event.button;
                        }
                        if ( _state === STATE.ROTATE && ! _this.noRotate ) {
                            _moveCurr.copy( getMouseOnCircle( event.pageX, event.pageY ) );
                            _movePrev.copy( _moveCurr );
                        } else if ( _state === STATE.ZOOM && ! _this.noZoom ) {
                            _zoomStart.copy( getMouseOnScreen( event.pageX, event.pageY ) );
                            _zoomEnd.copy( _zoomStart );
                        } else if ( _state === STATE.PAN && ! _this.noPan ) {
                            _panStart.copy( getMouseOnScreen( event.pageX, event.pageY ) );
                            _panEnd.copy( _panStart );
                        }
                        document.addEventListener( 'mousemove', mousemove, false );
                        document.addEventListener( 'mouseup', mouseup, false );
                    }, false );

                    function mousemove( event ) {
                        if ( _this.enabled === false ) return;
                        event.preventDefault();
                        event.stopPropagation();
                        if ( _state === STATE.ROTATE && ! _this.noRotate ) {
                            _movePrev.copy( _moveCurr );
                            _moveCurr.copy( getMouseOnCircle( event.pageX, event.pageY ) );
                        } else if ( _state === STATE.ZOOM && ! _this.noZoom ) {
                            _zoomEnd.copy( getMouseOnScreen( event.pageX, event.pageY ) );
                        } else if ( _state === STATE.PAN && ! _this.noPan ) {
                            _panEnd.copy( getMouseOnScreen( event.pageX, event.pageY ) );
                        }
                    }

                    function mouseup( event ) {
                        if ( _this.enabled === false ) return;
                        event.preventDefault();
                        event.stopPropagation();
                        _state = STATE.NONE;
                        document.removeEventListener( 'mousemove', mousemove );
                        document.removeEventListener( 'mouseup', mouseup );
                    }

                    this.domElement.addEventListener( 'mousewheel', mousewheel, false );
                    this.domElement.addEventListener( 'DOMMouseScroll', mousewheel, false );

                    function mousewheel( event ) {
                        if ( _this.enabled === false ) return;
                        event.preventDefault();
                        event.stopPropagation();
                        switch ( event.deltaMode ) {
                            case 2:
                                _zoomStart.y -= event.deltaY * 0.025;
                                break;
                            case 1:
                                _zoomStart.y -= event.deltaY * 0.01;
                                break;
                            default:
                                _zoomStart.y -= event.deltaY * 0.00025;
                                break;
                        }
                        _this.dispatchEvent( { type: 'change' } );
                    }

                    this.handleResize();
                    if ( this.domElement !== document ) {
                        this.handleResize();
                    }
                };
                THREE.TrackballControls.prototype = Object.create( THREE.EventDispatcher.prototype );
                THREE.TrackballControls.prototype.constructor = THREE.TrackballControls;

                console.log('✅ All Three.js components loaded successfully');
            } else {
                console.error('THREE.js not loaded');
            }
        });
    </script>
    
    <!-- Pre-define callback function -->
    <script>
        // Global callback function for Google Sign-In
        function handleCredentialResponse(response) {
            console.log('Google Sign-In callback triggered');
            // Call the app's handler when it's loaded
            if (window.appHandleCredentialResponse) {
                window.appHandleCredentialResponse(response);
            } else {
                // Store response for later if app not loaded yet
                window.pendingCredentialResponse = response;
            }
        }
    </script>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginContainer" class="login-container">
        <div class="login-card">
            <h1>3D Profile Visualization</h1>
            <p>Sign in with Google to access the periodic table visualization</p>
            <div id="g_id_onload"
                 data-client_id="953717110168-ld8sea9hpv1q67levd6n5bqo25asfvv1.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false"
                 data-use_fedcm_for_prompt="true">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-size="large"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-shape="rectangular"
                 data-logo_alignment="left">
            </div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="appContainer" class="app-container" style="display: none;">
        <!-- Loading indicator -->
        <div id="loadingIndicator" class="loading">
            <div class="spinner"></div>
            <p>Loading profiles from Google Sheets...</p>
        </div>

        <!-- 3D Container -->
        <div id="container" class="visualization-container"></div>

        <!-- Controls - Bottom positioned like original -->
        <div id="menu" class="menu">
            <button id="table">TABLE</button>
            <button id="sphere">SPHERE</button>
            <button id="helix">HELIX</button>
            <button id="grid">GRID</button>
            <button id="logout" onclick="logout()" class="logout-btn">LOGOUT</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
