<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Profile Visualization - Periodic Table Style</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Three.js core -->
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    
    <!-- Pre-define callback function -->
    <script>
        // Global callback function for Google Sign-In
        function handleCredentialResponse(response) {
            console.log('Google Sign-In callback triggered');
            // Call the app's handler when it's loaded
            if (window.appHandleCredentialResponse) {
                window.appHandleCredentialResponse(response);
            } else {
                // Store response for later if app not loaded yet
                window.pendingCredentialResponse = response;
            }
        }
    </script>
    
    <!-- Three.js CSS3D Components -->
    <script>
        window.addEventListener('load', function() {
            if (typeof THREE !== 'undefined') {
                console.log('✅ THREE.js core loaded');
                
                // CSS3DObject - Exact Three.js implementation
                THREE.CSS3DObject = function ( element ) {
                    THREE.Object3D.call( this );
                    this.element = element;
                    this.element.style.position = 'absolute';
                    this.addEventListener( 'removed', function () {
                        this.traverse( function ( child ) {
                            if ( child.element instanceof Element && child.element.parentNode ) {
                                child.element.parentNode.removeChild( child.element );
                            }
                        } );
                    } );
                };
                THREE.CSS3DObject.prototype = Object.create( THREE.Object3D.prototype );
                THREE.CSS3DObject.prototype.constructor = THREE.CSS3DObject;

                // CSS3DRenderer - Exact Three.js implementation
                THREE.CSS3DRenderer = function ( parameters ) {
                    var _this = this;
                    var _width, _height;
                    var _widthHalf, _heightHalf;
                    var matrix = new THREE.Matrix4();
                    var cache = {
                        camera: { fov: 0, style: '' },
                        objects: new WeakMap()
                    };
                    var domElement = document.createElement( 'div' );
                    domElement.style.overflow = 'hidden';
                    this.domElement = domElement;
                    var cameraElement = document.createElement( 'div' );
                    cameraElement.style.WebkitTransformStyle = 'preserve-3d';
                    cameraElement.style.transformStyle = 'preserve-3d';
                    domElement.appendChild( cameraElement );

                    this.setSize = function ( width, height ) {
                        _width = width;
                        _height = height;
                        _widthHalf = _width / 2;
                        _heightHalf = _height / 2;
                        domElement.style.width = width + 'px';
                        domElement.style.height = height + 'px';
                        cameraElement.style.width = width + 'px';
                        cameraElement.style.height = height + 'px';
                    };

                    var getCameraCSSMatrix = function ( matrix ) {
                        var elements = matrix.elements;
                        return 'matrix3d(' +
                            epsilon( elements[ 0 ] ) + ',' +
                            epsilon( - elements[ 1 ] ) + ',' +
                            epsilon( elements[ 2 ] ) + ',' +
                            epsilon( elements[ 3 ] ) + ',' +
                            epsilon( elements[ 4 ] ) + ',' +
                            epsilon( - elements[ 5 ] ) + ',' +
                            epsilon( elements[ 6 ] ) + ',' +
                            epsilon( elements[ 7 ] ) + ',' +
                            epsilon( elements[ 8 ] ) + ',' +
                            epsilon( - elements[ 9 ] ) + ',' +
                            epsilon( elements[ 10 ] ) + ',' +
                            epsilon( elements[ 11 ] ) + ',' +
                            epsilon( elements[ 12 ] ) + ',' +
                            epsilon( - elements[ 13 ] ) + ',' +
                            epsilon( elements[ 14 ] ) + ',' +
                            epsilon( elements[ 15 ] ) +
                        ')';
                    };

                    var getObjectCSSMatrix = function ( matrix, cameraCSSMatrix ) {
                        var elements = matrix.elements;
                        var matrix3d = 'matrix3d(' +
                            epsilon( elements[ 0 ] ) + ',' +
                            epsilon( elements[ 1 ] ) + ',' +
                            epsilon( elements[ 2 ] ) + ',' +
                            epsilon( elements[ 3 ] ) + ',' +
                            epsilon( - elements[ 4 ] ) + ',' +
                            epsilon( - elements[ 5 ] ) + ',' +
                            epsilon( - elements[ 6 ] ) + ',' +
                            epsilon( - elements[ 7 ] ) + ',' +
                            epsilon( elements[ 8 ] ) + ',' +
                            epsilon( elements[ 9 ] ) + ',' +
                            epsilon( elements[ 10 ] ) + ',' +
                            epsilon( elements[ 11 ] ) + ',' +
                            epsilon( elements[ 12 ] ) + ',' +
                            epsilon( elements[ 13 ] ) + ',' +
                            epsilon( elements[ 14 ] ) + ',' +
                            epsilon( elements[ 15 ] ) +
                        ')';
                        if ( cameraCSSMatrix === 'none' ) {
                            return 'translate3d(-50%,-50%,0) ' + matrix3d;
                        } else {
                            return 'translate3d(-50%,-50%,0) ' + matrix3d + ' ' + cameraCSSMatrix;
                        }
                    };

                    var renderObject = function ( object, scene, camera, cameraCSSMatrix ) {
                        if ( object instanceof THREE.CSS3DObject ) {
                            object.onBeforeRender( _this, scene, camera );
                            var style;
                            if ( object instanceof THREE.CSS3DSprite ) {
                                matrix.copy( camera.matrixWorldInverse );
                                matrix.transpose();
                                if ( object.rotation2D !== 0 ) matrix.multiply( object.rotationMatrix );
                                matrix.copyPosition( object.matrixWorld );
                                matrix.scale( object.scale );
                                matrix.elements[ 3 ] = 0;
                                matrix.elements[ 7 ] = 0;
                                matrix.elements[ 11 ] = 0;
                                matrix.elements[ 15 ] = 1;
                                style = getObjectCSSMatrix( matrix, cameraCSSMatrix );
                            } else {
                                style = getObjectCSSMatrix( object.matrixWorld, cameraCSSMatrix );
                            }
                            var element = object.element;
                            var cachedObject = cache.objects.get( object );
                            if ( cachedObject === undefined || cachedObject.style !== style ) {
                                element.style.WebkitTransform = style;
                                element.style.transform = style;
                                var objectData = { style: style };
                                cache.objects.set( object, objectData );
                            }
                            if ( element.parentNode !== cameraElement ) {
                                cameraElement.appendChild( element );
                            }
                            object.onAfterRender( _this, scene, camera );
                        }
                        for ( var i = 0, l = object.children.length; i < l; i ++ ) {
                            renderObject( object.children[ i ], scene, camera, cameraCSSMatrix );
                        }
                    };

                    var epsilon = function ( value ) {
                        return Math.abs( value ) < 1e-10 ? 0 : value;
                    };

                    this.render = function ( scene, camera ) {
                        var fov = camera.projectionMatrix.elements[ 5 ] * _heightHalf;
                        var style = "translate3d(0,0," + fov + "px)" + getCameraCSSMatrix( camera.matrixWorldInverse ) + " translate3d(" + _widthHalf + "px," + _heightHalf + "px, 0)";
                        if ( cache.camera.style !== style ) {
                            cameraElement.style.WebkitTransform = style;
                            cameraElement.style.transform = style;
                            cache.camera.style = style;
                        }
                        renderObject( scene, scene, camera, style );
                    };
                };

                // TrackballControls - Simplified version
                THREE.TrackballControls = function ( object, domElement ) {
                    var _this = this;
                    this.object = object;
                    this.domElement = domElement || document;
                    this.enabled = true;
                    this.rotateSpeed = 1.0;
                    this.zoomSpeed = 1.2;
                    this.panSpeed = 0.3;
                    this.target = new THREE.Vector3();
                    
                    var _state = 'NONE';
                    var _eye = new THREE.Vector3();
                    var _rotateStart = new THREE.Vector2();
                    var _rotateEnd = new THREE.Vector2();
                    var _zoomStart = new THREE.Vector2();
                    var _zoomEnd = new THREE.Vector2();
                    
                    this.target0 = this.target.clone();
                    this.position0 = this.object.position.clone();
                    this.up0 = this.object.up.clone();
                    
                    this.update = function () {
                        _eye.subVectors( _this.object.position, _this.target );
                        if ( _state === 'ROTATE' ) {
                            var angle = Math.sqrt( Math.pow( _rotateEnd.x - _rotateStart.x, 2 ) + Math.pow( _rotateEnd.y - _rotateStart.y, 2 ) );
                            if ( angle ) {
                                var axis = new THREE.Vector3();
                                axis.set( _rotateEnd.y - _rotateStart.y, _rotateEnd.x - _rotateStart.x, 0 ).normalize();
                                var quaternion = new THREE.Quaternion();
                                quaternion.setFromAxisAngle( axis, angle * _this.rotateSpeed );
                                _eye.applyQuaternion( quaternion );
                                _this.object.up.applyQuaternion( quaternion );
                            }
                            _rotateStart.copy( _rotateEnd );
                        }
                        if ( _state === 'ZOOM' ) {
                            var factor = 1.0 + ( _zoomEnd.y - _zoomStart.y ) * _this.zoomSpeed;
                            if ( factor !== 1.0 && factor > 0.0 ) {
                                _eye.multiplyScalar( factor );
                            }
                            _zoomStart.copy( _zoomEnd );
                        }
                        _this.object.position.addVectors( _this.target, _eye );
                        _this.object.lookAt( _this.target );
                    };
                    
                    function onMouseDown( event ) {
                        if ( _this.enabled === false ) return;
                        event.preventDefault();
                        if ( event.button === 0 ) {
                            _state = 'ROTATE';
                            _rotateStart.set( event.clientX, event.clientY );
                        } else if ( event.button === 1 ) {
                            _state = 'ZOOM';
                            _zoomStart.set( event.clientX, event.clientY );
                        }
                        document.addEventListener( 'mousemove', onMouseMove, false );
                        document.addEventListener( 'mouseup', onMouseUp, false );
                    }
                    
                    function onMouseMove( event ) {
                        if ( _this.enabled === false ) return;
                        event.preventDefault();
                        if ( _state === 'ROTATE' ) {
                            _rotateEnd.set( event.clientX, event.clientY );
                            _this.update();
                        } else if ( _state === 'ZOOM' ) {
                            _zoomEnd.set( event.clientX, event.clientY );
                            _this.update();
                        }
                    }
                    
                    function onMouseUp( event ) {
                        if ( _this.enabled === false ) return;
                        event.preventDefault();
                        _state = 'NONE';
                        document.removeEventListener( 'mousemove', onMouseMove );
                        document.removeEventListener( 'mouseup', onMouseUp );
                    }
                    
                    function onMouseWheel( event ) {
                        if ( _this.enabled === false ) return;
                        event.preventDefault();
                        var delta = 0;
                        if ( event.wheelDelta ) {
                            delta = event.wheelDelta / 40;
                        } else if ( event.detail ) {
                            delta = - event.detail / 3;
                        } else if ( event.deltaY ) {
                            delta = - event.deltaY / 3;
                        }
                        _eye.subVectors( _this.object.position, _this.target );
                        _eye.multiplyScalar( 1 - delta * 0.01 );
                        _this.object.position.addVectors( _this.target, _eye );
                        _this.object.lookAt( _this.target );
                    }
                    
                    this.domElement.addEventListener( 'mousedown', onMouseDown, false );
                    this.domElement.addEventListener( 'wheel', onMouseWheel, false );
                    this.domElement.addEventListener( 'DOMMouseScroll', onMouseWheel, false );
                    
                    this.addEventListener = function() {};
                    this.dispatchEvent = function() {};
                };
                THREE.TrackballControls.prototype = Object.create( THREE.EventDispatcher.prototype );
                THREE.TrackballControls.prototype.constructor = THREE.TrackballControls;
                
                console.log('✅ All Three.js components loaded');
            }
        });
    </script>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginContainer" class="login-container">
        <div class="login-card">
            <h1>3D Profile Visualization</h1>
            <p>Sign in with Google to access the periodic table visualization</p>
            <div id="g_id_onload"
                 data-client_id="953717110168-ld8sea9hpv1q67levd6n5bqo25asfvv1.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false"
                 data-use_fedcm_for_prompt="true">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-size="large"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-shape="rectangular"
                 data-logo_alignment="left">
            </div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="appContainer" class="app-container" style="display: none;">
        <!-- Loading indicator -->
        <div id="loadingIndicator" class="loading">
            <div class="spinner"></div>
            <p>Loading profiles from Google Sheets...</p>
        </div>

        <!-- 3D Container -->
        <div id="container" class="visualization-container"></div>

        <!-- Controls - Bottom positioned like original -->
        <div id="menu" class="menu">
            <button id="table">TABLE</button>
            <button id="sphere">SPHERE</button>
            <button id="helix">HELIX</button>
            <button id="grid">GRID</button>
            <button id="logout" onclick="logout()" class="logout-btn">LOGOUT</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
