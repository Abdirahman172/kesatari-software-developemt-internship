<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Profile Visualization</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Three.js core -->
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    
    <!-- Define callback function before Google Sign-In loads -->
    <script>
        // Pre-define the callback function to avoid timing issues
        function handleCredentialResponse(response) {
            console.log('Google Sign-In callback triggered');
            // The actual implementation will be loaded from app.js
            if (window.handleCredentialResponse && window.handleCredentialResponse !== handleCredentialResponse) {
                window.handleCredentialResponse(response);
            }
        }
        window.handleCredentialResponse = handleCredentialResponse;
    </script>
    
    <!-- Wait for THREE to load, then add components -->
    <script>
        window.addEventListener('load', function() {
            if (typeof THREE !== 'undefined') {
                console.log('✅ THREE.js core loaded');
                
                // Add CSS3DObject - simplified version that doesn't inherit from Object3D
                THREE.CSS3DObject = function ( element ) {
                    // Create a simple object with the properties we need
                    this.element = element;
                    this.element.style.position = 'absolute';
                    
                    // Add basic 3D object properties
                    this.position = { x: 0, y: 0, z: 0 };
                    this.rotation = { x: 0, y: 0, z: 0 };
                    this.scale = { x: 1, y: 1, z: 1 };
                    this.visible = true;
                    
                    // Add to scene method
                    this.add = function(child) {
                        // Simple add functionality
                    };
                    
                    // Traverse method for compatibility
                    this.traverse = function(callback) {
                        callback(this);
                    };
                };
                
                // Don't inherit from Object3D to avoid constructor issues
                THREE.CSS3DObject.prototype.constructor = THREE.CSS3DObject;

                // Add CSS3DRenderer
                THREE.CSS3DRenderer = function () {
                    var _this = this;
                    var _width, _height;
                    var _widthHalf, _heightHalf;
                    var domElement = document.createElement( 'div' );
                    domElement.style.overflow = 'hidden';
                    this.domElement = domElement;
                    var cameraElement = document.createElement( 'div' );
                    cameraElement.style.WebkitTransformStyle = 'preserve-3d';
                    cameraElement.style.transformStyle = 'preserve-3d';
                    domElement.appendChild( cameraElement );

                    this.setSize = function ( width, height ) {
                        _width = width;
                        _height = height;
                        _widthHalf = _width / 2;
                        _heightHalf = _height / 2;
                        domElement.style.width = width + 'px';
                        domElement.style.height = height + 'px';
                        cameraElement.style.width = width + 'px';
                        cameraElement.style.height = height + 'px';
                    };

                    this.render = function ( scene, camera ) {
                        var fov = camera.projectionMatrix.elements[ 5 ] * _heightHalf;
                        if ( camera.isPerspectiveCamera ) {
                            domElement.style.WebkitPerspective = fov + 'px';
                            domElement.style.perspective = fov + 'px';
                        }
                        if ( scene.autoUpdate === true ) scene.updateMatrixWorld();
                        if ( camera.parent === null ) camera.updateMatrixWorld();
                        
                        // Render all CSS3DObjects in the scene
                        if (scene.children) {
                            scene.children.forEach(function(object) {
                                if (object instanceof THREE.CSS3DObject && object.visible) {
                                    if (object.element.parentNode !== cameraElement) {
                                        cameraElement.appendChild(object.element);
                                    }
                                    // Apply transform based on position
                                    var style = 'translate3d(' + object.position.x + 'px,' + object.position.y + 'px,' + object.position.z + 'px)';
                                    if (object.rotation.x !== 0 || object.rotation.y !== 0 || object.rotation.z !== 0) {
                                        style += ' rotateX(' + object.rotation.x + 'rad) rotateY(' + object.rotation.y + 'rad) rotateZ(' + object.rotation.z + 'rad)';
                                    }
                                    object.element.style.transform = style;
                                }
                            });
                        }
                    };
                };

                // Add TrackballControls - working version
                THREE.TrackballControls = function ( object, domElement ) {
                    var _this = this;
                    this.object = object;
                    this.domElement = domElement || document;
                    this.enabled = true;
                    this.rotateSpeed = 1.0;
                    this.zoomSpeed = 1.2;
                    this.panSpeed = 0.3;
                    this.target = new THREE.Vector3();
                    
                    // Internal state
                    var _state = 'NONE';
                    var _eye = new THREE.Vector3();
                    var _rotateStart = new THREE.Vector2();
                    var _rotateEnd = new THREE.Vector2();
                    var _zoomStart = new THREE.Vector2();
                    var _zoomEnd = new THREE.Vector2();
                    
                    // Store initial camera position
                    this.target0 = this.target.clone();
                    this.position0 = this.object.position.clone();
                    this.up0 = this.object.up.clone();
                    
                    this.update = function () {
                        _eye.subVectors( _this.object.position, _this.target );
                        
                        // Rotate camera
                        if (_state === 'ROTATE') {
                            var angle = Math.sqrt(
                                Math.pow(_rotateEnd.x - _rotateStart.x, 2) +
                                Math.pow(_rotateEnd.y - _rotateStart.y, 2)
                            );
                            
                            if (angle) {
                                var axis = new THREE.Vector3();
                                axis.set(
                                    _rotateEnd.y - _rotateStart.y,
                                    _rotateEnd.x - _rotateStart.x,
                                    0
                                ).normalize();
                                
                                var quaternion = new THREE.Quaternion();
                                quaternion.setFromAxisAngle(axis, angle * _this.rotateSpeed);
                                _eye.applyQuaternion(quaternion);
                                _this.object.up.applyQuaternion(quaternion);
                            }
                            
                            _rotateStart.copy(_rotateEnd);
                        }
                        
                        // Zoom camera
                        if (_state === 'ZOOM') {
                            var factor = 1.0 + (_zoomEnd.y - _zoomStart.y) * _this.zoomSpeed;
                            if (factor !== 1.0 && factor > 0.0) {
                                _eye.multiplyScalar(factor);
                            }
                            _zoomStart.copy(_zoomEnd);
                        }
                        
                        _this.object.position.addVectors( _this.target, _eye );
                        _this.object.lookAt( _this.target );
                    };
                    
                    // Mouse event handlers
                    function onMouseDown( event ) {
                        if ( _this.enabled === false ) return;
                        event.preventDefault();
                        
                        if ( event.button === 0 ) {
                            _state = 'ROTATE';
                            _rotateStart.set( event.clientX, event.clientY );
                        } else if ( event.button === 1 ) {
                            _state = 'ZOOM';
                            _zoomStart.set( event.clientX, event.clientY );
                        }
                        
                        document.addEventListener( 'mousemove', onMouseMove, false );
                        document.addEventListener( 'mouseup', onMouseUp, false );
                    }
                    
                    function onMouseMove( event ) {
                        if ( _this.enabled === false ) return;
                        event.preventDefault();
                        
                        if ( _state === 'ROTATE' ) {
                            _rotateEnd.set( event.clientX, event.clientY );
                            _this.update();
                        } else if ( _state === 'ZOOM' ) {
                            _zoomEnd.set( event.clientX, event.clientY );
                            _this.update();
                        }
                    }
                    
                    function onMouseUp( event ) {
                        if ( _this.enabled === false ) return;
                        event.preventDefault();
                        
                        _state = 'NONE';
                        
                        document.removeEventListener( 'mousemove', onMouseMove );
                        document.removeEventListener( 'mouseup', onMouseUp );
                    }
                    
                    function onMouseWheel( event ) {
                        if ( _this.enabled === false ) return;
                        event.preventDefault();
                        
                        var delta = 0;
                        if ( event.wheelDelta ) {
                            delta = event.wheelDelta / 40;
                        } else if ( event.detail ) {
                            delta = - event.detail / 3;
                        } else if ( event.deltaY ) {
                            delta = - event.deltaY / 3;
                        }
                        
                        _eye.subVectors( _this.object.position, _this.target );
                        _eye.multiplyScalar( 1 - delta * 0.01 );
                        _this.object.position.addVectors( _this.target, _eye );
                        _this.object.lookAt( _this.target );
                    }
                    
                    // Add event listeners
                    this.domElement.addEventListener( 'mousedown', onMouseDown, false );
                    this.domElement.addEventListener( 'wheel', onMouseWheel, false );
                    this.domElement.addEventListener( 'DOMMouseScroll', onMouseWheel, false ); // Firefox
                    
                    // Stub methods for compatibility
                    this.addEventListener = function() {};
                    this.dispatchEvent = function() {};
                    this.handleResize = function() {};
                };
                THREE.TrackballControls.prototype = Object.create( THREE.EventDispatcher.prototype );
                THREE.TrackballControls.prototype.constructor = THREE.TrackballControls;
                
                console.log('✅ All Three.js components loaded inline');
            } else {
                console.error('❌ THREE.js not loaded');
            }
        });
    </script>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginContainer" class="login-container">
        <div class="login-card">
            <h1>3D Profile Visualization</h1>
            <p>Sign in with Google to access the visualization</p>
            <div id="g_id_onload"
                 data-client_id="953717110168-ld8sea9hpv1q67levd6n5bqo25asfvv1.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false"
                 data-use_fedcm_for_prompt="true">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-size="large"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-shape="rectangular"
                 data-logo_alignment="left">
            </div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="appContainer" class="app-container" style="display: none;">
        <!-- Controls -->
        <div class="controls">
            <button id="tableBtn" class="layout-btn active">Table</button>
            <button id="sphereBtn" class="layout-btn">Sphere</button>
            <button id="helixBtn" class="layout-btn">Double Helix</button>
            <button id="gridBtn" class="layout-btn">Grid</button>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>

        <!-- Data source indicator -->
        <div id="dataSource" class="data-source">
            <span id="dataSourceText">Data: Google Sheets</span>
            <span id="profileCount"></span>
            <div id="debugInfo" style="font-size: 11px; opacity: 0.7; margin-top: 5px;"></div>
            <div id="layoutInfo" style="font-size: 11px; opacity: 0.8; margin-top: 3px; color: #28a745;"></div>
        </div>

        <!-- Loading indicator -->
        <div id="loadingIndicator" class="loading">
            <div class="spinner"></div>
            <p id="loadingText">Loading data from Google Sheets...</p>
        </div>

        <!-- 3D Container -->
        <div id="container" class="visualization-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
